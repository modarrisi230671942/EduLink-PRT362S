# REST API served on http://localhost:8080/api
server.port=8080

# -------------------------------------------------------------
# MySQL CONFIGURATION
# The edulink_db database is created automatically if it does not exist.
# Change the username/password below to match YOUR local MySQL server.
# (XAMPP's default is root with an empty password; a standalone MySQL install
#  uses the root password you chose during installation.)
# Each value can also be overridden with an environment variable, e.g. DB_PASSWORD.
# -------------------------------------------------------------
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/edulink_db?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:}

# -------------------------------------------------------------
# DATABASE MIGRATIONS (Flyway) — src/main/resources/db/migration
# Tables are owned by the migrations, so Hibernate only validates them.
# baseline-on-migrate lets Flyway adopt a database created before migrations existed.
# -------------------------------------------------------------
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=1
spring.jpa.hibernate.ddl-auto=none
spring.sql.init.mode=never

# JPA: all data is loaded inside service transactions and returned as DTOs
spring.jpa.open-in-view=false
spring.jpa.show-sql=false

# -------------------------------------------------------------
# SECURITY
# JWT secret: Base64-encoded, at least 256 bits. CHANGE THIS in any shared/production deployment,
# e.g. set the JWT_SECRET environment variable.
# -------------------------------------------------------------
edulink.jwt.secret=${JWT_SECRET:ZWR1bGluay1kZXYtc2VjcmV0LWtleS1jaGFuZ2UtbWUtaW4tcHJvZHVjdGlvbi0yMDI2}
edulink.jwt.expiration-minutes=480
# Frontend origins allowed to call the API (Vite dev server)
edulink.cors.allowed-origins=http://localhost:5173,http://127.0.0.1:5173

# -------------------------------------------------------------
# CV UPLOADS — stored on disk, relative to where the backend is started
# -------------------------------------------------------------
edulink.upload-dir=uploads
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=6MB

# -------------------------------------------------------------
# API DOCUMENTATION — http://localhost:8080/swagger-ui.html
# -------------------------------------------------------------
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operationsSorter=method
springdoc.swagger-ui.tagsSorter=alpha

# Never send stack traces or exception details to the client
server.error.include-message=never
server.error.include-stacktrace=never
