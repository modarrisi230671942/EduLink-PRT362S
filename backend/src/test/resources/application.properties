# Test configuration: an in-memory H2 database, created fresh for the test run.
# Tests never touch your real MySQL data.
spring.datasource.url=jdbc:h2:mem:edulink_test;MODE=MySQL;DB_CLOSE_DELAY=-1
spring.datasource.username=sa
spring.datasource.password=
spring.flyway.enabled=false
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.open-in-view=false
spring.sql.init.mode=never

edulink.jwt.secret=dGVzdC1zZWNyZXQta2V5LWZvci1lZHVsaW5rLXVuaXQtdGVzdHMtb25seS0yMDI2
edulink.jwt.expiration-minutes=60
edulink.cors.allowed-origins=http://localhost:5173
edulink.upload-dir=target/test-uploads
