# EduLink — whole system with one command:
#
#     docker compose up --build
#
# Then open http://localhost:3000  (API docs: http://localhost:8080/swagger-ui.html)
# The database, tables and demo data are created automatically on first start.
# Optional: copy .env.example to .env to change the passwords/secret below.

services:
  db:
    image: mysql:8.0
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD:-edulink-dev-password}
      MYSQL_DATABASE: edulink_db
    volumes:
      - db-data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -uroot -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 5s
      timeout: 5s
      retries: 20

  backend:
    build: ./backend
    environment:
      DB_URL: jdbc:mysql://db:3306/edulink_db?useSSL=false&allowPublicKeyRetrieval=true
      DB_USERNAME: root
      DB_PASSWORD: ${DB_PASSWORD:-edulink-dev-password}
      JWT_SECRET: ${JWT_SECRET:-ZWR1bGluay1kb2NrZXItZGV2LXNlY3JldC1jaGFuZ2UtbWUtaW4tcHJvZHVjdGlvbg==}
      EDULINK_CORS_ALLOWED_ORIGINS: http://localhost:3000
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - cv-uploads:/app/uploads
    ports:
      - "8080:8080"

  frontend:
    build: ./frontend
    depends_on:
      - backend
    ports:
      - "3000:80"

volumes:
  db-data:
  cv-uploads:
